{{- /* Hosts without the dev group get the lite nvim config. */ -}}
{{- $dev := has "dev" (index .packages.hosts .chezmoi.hostname | default list) -}}
{{- $repos := list "nvim" "claude-starship-rs" "git-last-commit-rs" -}}
{{ range $repos }}
{{- $repo := . }}{{ if and (eq . "nvim") (not $dev) }}{{ $repo = "nvim-lite" }}{{ end }}
[".config/{{ . }}"]
    type = "git-repo"
    url = "https://github.com/scottfones/{{ $repo }}.git"
    refreshPeriod = "168h"
    [".config/{{ . }}".pull]
        args = ["--ff-only"]
{{ end }}
{{- if eq .chezmoi.osRelease.id "debian" }}
# Debian's neovim is too old for LazyVim; use the upstream release build.
[".local/opt/nvim"]
    type = "archive"
    url = "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-arm64.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# Static release build; same layout as `make install PREFIX=~/.local`.
[".local/bin/btop"]
    type = "archive-file"
    url = "https://github.com/aristocratos/btop/releases/latest/download/btop-aarch64-unknown-linux-musl.tar.gz"
    path = "btop/bin/btop"
    executable = true
    refreshPeriod = "168h"
[".local/share/btop/themes"]
    type = "archive"
    url = "https://github.com/aristocratos/btop/releases/latest/download/btop-aarch64-unknown-linux-musl.tar.gz"
    include = ["btop/themes/**"]
    exact = true
    stripComponents = 2
    refreshPeriod = "168h"
{{ end -}}
