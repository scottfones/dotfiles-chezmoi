[global]
cache-dir = "~/.cache/rumdl"
extend-enable = [
  "MD060", # Table Format
  "MD070", # Nested Code Fence Collision
  "MD073", # Table of Contents Validation
  "MD080", # Unique Heading Anchors
  "MD084", # Invisible Unicode Characters
  "MD085", # Paragraph Continuation Indent
  "MD087", # Unused Disable Comment
  "MD088", # Quotes and Dashes
  "MD091", # No Markdown In HTML
]
line-length = 100

[per-file-ignores]
# GitHub posts render line breaks and have no top-level heading
"**/*.gh_post.md" = ["MD013", "MD041"]
# Line length excludes `/// `
"**/*.rs" = ["MD013"]
# Must stay one line per entry
"**/memory/MEMORY.md" = ["MD013"]
# Allow HTML in README
"README.md" = ["MD033"]

# Heading style: "atx" = #
[MD003]
style = "atx"

# Bullet list marker
[MD004]
style = "dash"

# Line length
[MD013]
code-blocks = false
reflow = true
tables = false

# Missing space after hash in heading
[MD018]
magiclink = true

# Proper name capitalization
[MD044]
names = ["GitHub", "Markdown"]
whole-words = true

# Code block style
[MD046]
style = "fenced"

# Code fence character
[MD048]
style = "backtick"

# Italic marker
[MD049]
style = "asterisk"

# Bold marker
[MD050]
style = "asterisk"

# Table Format
[MD060]
style = "aligned"

# Unique Heading Anchors
[MD080]
anchor-style = "github"

# ASCII quotes and dashes
[MD088]
normalize-dashes = true
normalize-quotes = true
