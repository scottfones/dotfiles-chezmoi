[global]
exclude = ["node_modules", "build", "dist", "target"]
flavor = "standard"
line-length = 100
respect-gitignore = true

# Per-file flavor overrides
[per-file-flavor]
"**/*.mdx" = "mdx"

# Disable specific rules for specific files
[per-file-ignores]
"README.md" = ["MD033"]  # Allow HTML in README
"SUMMARY.md" = ["MD025"]  # Allow multiple H1 in table of contents
"**/*.rs" = ["MD013"]

# Configure individual rules
[MD007]
indent = 2

[MD013]
code-blocks = false
line-length = 100
reflow = true
tables = false

[MD025]
front-matter-title = "title"
level = 1

[MD044]
names = ["rumdl", "Markdown", "GitHub"]

[MD048]
style = "backtick"

[MD088]
normalize-dashes = true
